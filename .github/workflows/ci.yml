# Work State: Completed: Implemented; Active: None; Blocked: None; Next Move: Maintain as needed.

name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Linux (including WSL) is the required target. The native Windows leg is
    # best-effort and must not block a run when it fails.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        shell: bash
        run: uv python install "$(cat apps/python/.python-version)"

      - name: Install dependencies
        run: |
          npm ci
          uv sync --project apps/python

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Workspace self-check
        run: node scripts/workspace-cli.mjs self-check
