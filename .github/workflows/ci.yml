name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        shell: bash
        run: uv python install "$(cat apps/python/.python-version)"

      - name: Install dependencies
        run: |
          npm ci
          uv sync --frozen --project apps/python

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Workspace self-check
        run: node scripts/workspace-cli.mjs self-check
