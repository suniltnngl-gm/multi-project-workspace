name: Reusable repository governance and contract verification

on:
  workflow_call:
    inputs:
      descriptor_path:
        description: Path to workspace-repo.json in the caller repository
        required: false
        type: string
        default: workspace-repo.json
      governance_required:
        description: Require the spoke AGENTS.md file (set false only for explicitly deferred governance)
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  portable-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out caller repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out pinned Core workflow kit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: suniltnngl-gm/multi-project-workspace
          ref: ${{ github.workflow_sha }}
          path: .workspace-kit
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Validate descriptor, portability and descriptive provenance
        shell: bash
        env:
          DESCRIPTOR_PATH: ${{ inputs.descriptor_path }}
          GOVERNANCE_REQUIRED: ${{ inputs.governance_required }}
        run: |
          set -euo pipefail
          node .workspace-kit/scripts/workspace-federation.mjs descriptor "$GITHUB_WORKSPACE" "$DESCRIPTOR_PATH" "$GITHUB_WORKSPACE/.workspace-kit/schemas/workspace-repo.schema.json"
          node .workspace-kit/scripts/workspace-subtree.mjs preflight --repo "$GITHUB_WORKSPACE" --descriptor "$DESCRIPTOR_PATH"
          node .workspace-kit/scripts/workspace-federation.mjs provenance "$GITHUB_WORKSPACE" "$DESCRIPTOR_PATH" "$GITHUB_WORKSPACE/.workspace-kit/schemas/workspace-repo.schema.json" > "$RUNNER_TEMP/workspace-provenance.json"
          if [[ "$GOVERNANCE_REQUIRED" == "true" && ! -f AGENTS.md ]]; then
            echo "::error::AGENTS.md is required by this reusable workflow invocation."
            exit 1
          fi

      - name: Upload descriptive provenance attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workspace-provenance
          path: ${{ runner.temp }}/workspace-provenance.json
          if-no-files-found: error

      - name: Verify offline unit target
        shell: bash
        run: |
          set -euo pipefail
          node scripts/workspace-verify.mjs unit
